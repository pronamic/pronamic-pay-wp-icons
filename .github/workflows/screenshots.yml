name: Screenshots

on:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start

      - name: Screenshots
        run: npm run screenshots

      - name: wordpress.org banner and icon
        run: npm run screenshots:assets

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-org
          path: .wordpress-org/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-screenshots
          commit-message: Update screenshots and wordpress.org assets
          title: Update screenshots and wordpress.org assets
          body: |
            Screenshots, banner and icon in `.wordpress-org/` regenerated by the [Screenshots workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          add-paths: .wordpress-org/
